name: Update indexes

on:
  workflow_dispatch:
    inputs:
      version:
        description: PyLops version to index (e.g. 2.8.0); leave empty for all releases without an index
        type: string
        required: false
        default: ""

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Build indexes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            make index-all VERSIONS="$VERSION"
          else
            make index-missing
          fi
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: indexes/${{ inputs.version || 'missing' }}
          add-paths: pylops_mcp/data/indexes/*.json
          commit-message: "Add PyLops ${{ inputs.version || 'missing release' }} index"
          title: "Add PyLops ${{ inputs.version || 'missing release' }} index"
          body: |
            Index files generated by the `Update indexes` workflow
            (`make ${{ inputs.version && 'index-all' || 'index-missing' }}`).

            Review the diff, then merge before tagging a release.
