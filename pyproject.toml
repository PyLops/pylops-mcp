[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pylops-mcp"
dynamic = ["version"]
description = "PyLops MCP Server"
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "PyLops developers" }]
keywords = ["pylops", "mcp", "model-context-protocol", "linear-operators", "inverse-problems"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "mcp[cli]<2",
    "numpydoc>=1.11.0",
    "pylops>=2.8.0",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/PyLops/pylops-mcp"
Repository = "https://github.com/PyLops/pylops-mcp"
Issues = "https://github.com/PyLops/pylops-mcp/issues"
PyLops = "https://pylops.readthedocs.io"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"  # PyPI rejects local versions (dirty tree after `make index`)

[tool.hatch.build.targets.sdist]
include = ["pylops_mcp", "tests", "README.md", "LICENSE", "Makefile"]

[tool.hatch.build.targets.wheel]
packages = ["pylops_mcp"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[project.scripts]
pylops-mcp = "pylops_mcp.server:main"

[[tool.mypy.overrides]]
module = ["pylops.*", "numpydoc.*"]
ignore_missing_imports = true
