[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pylops-mcp"
dynamic = ["version"]
description = "MCP server exposing PyLops operators and solvers in a structured way"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]<2",
    "numpydoc>=1.11.0",
    "pylops>=2.8.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["pylops_mcp"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[project.scripts]
pylops-mcp = "pylops_mcp.server:main"

[[tool.mypy.overrides]]
module = ["pylops.*", "numpydoc.*"]
ignore_missing_imports = true
